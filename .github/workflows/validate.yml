name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate manifest and referenced files
        run: node scripts/validate.mjs

      - name: Check JS syntax
        run: |
          for f in background.js content-nooks.js content-scheduler.js popup.js scripts/validate.mjs; do
            echo "checking $f"
            node --check "$f"
          done
