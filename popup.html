<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --ink: #0d0d12;
        --muted: #6b7280;
        --line: #ececf1;
        --purple: #9371f0;
        --green-bg: #e7f8ee;
        --green-fg: #16a34a;
        --amber-fg: #b45309;
      }
      * { box-sizing: border-box; }
      body {
        font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
        width: 300px;
        margin: 0;
        color: var(--ink);
        background: #fff;
      }
      header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 14px;
        background: var(--ink);
        color: #fff;
      }
      header .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #9ca3af;
      }
      header.live .dot {
        background: #22c55e;
        box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.25);
      }
      header h1 {
        font-size: 12px;
        margin: 0;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      header .src { font-size: 11px; opacity: 0.55; font-weight: 500; }
      .body { padding: 14px; }
      .field { margin-bottom: 12px; }
      .field:last-of-type { margin-bottom: 0; }
      .field-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 3px;
      }
      .field-label {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .pill {
        font-size: 10px;
        font-weight: 700;
        padding: 2px 7px;
        border-radius: 999px;
        background: var(--green-bg);
        color: var(--green-fg);
      }
      .value {
        font-size: 14px;
        font-weight: 600;
        word-break: break-all;
      }
      .value.sub { font-size: 12px; font-weight: 500; color: var(--muted); margin-top: 1px; }
      .empty {
        text-align: center;
        padding: 8px 4px 4px;
      }
      .empty .big { font-size: 13px; font-weight: 600; color: #b91c1c; }
      .empty .small { font-size: 12px; color: var(--muted); margin-top: 4px; }
      .meta {
        font-size: 11px;
        color: var(--muted);
        margin-top: 12px;
        padding-top: 10px;
        border-top: 1px solid var(--line);
      }
      .meta.stale { color: var(--amber-fg); font-weight: 600; }
      button {
        margin-top: 12px;
        width: 100%;
        padding: 9px;
        border: 0;
        border-radius: 7px;
        background: var(--purple);
        color: #fff;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
      }
      button:disabled { background: #d1d5db; cursor: default; }
    </style>
  </head>
  <body>
    <header id="header">
      <span class="dot"></span>
      <h1>Easy Booking</h1>
      <span class="src">· from Nooks</span>
    </header>
    <div class="body">
      <div id="captured">
        <div class="field">
          <div class="field-head">
            <span class="field-label">Email</span>
            <span class="pill">Captured</span>
          </div>
          <div id="email" class="value"></div>
        </div>
        <div class="field" id="tz-field">
          <div class="field-head">
            <span class="field-label">Timezone</span>
            <span class="pill">Captured</span>
          </div>
          <div id="tz" class="value"></div>
          <div id="tz-sub" class="value sub"></div>
        </div>
        <div id="meta" class="meta"></div>
        <button id="fill">Fill booking form now</button>
      </div>
      <div id="empty" class="empty" style="display: none">
        <div class="big">No prospect captured yet</div>
        <div class="small">Open the Nooks dialer with a prospect loaded.</div>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
