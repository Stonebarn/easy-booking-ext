<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font-family: -apple-system, system-ui, sans-serif;
        width: 280px;
        margin: 0;
        padding: 14px;
        color: #1a1a1a;
      }
      h1 {
        font-size: 13px;
        margin: 0 0 10px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #666;
      }
      .email {
        font-size: 14px;
        font-weight: 600;
        word-break: break-all;
        padding: 8px 10px;
        background: #f3f4f6;
        border-radius: 6px;
        min-height: 18px;
      }
      .meta {
        font-size: 11px;
        color: #888;
        margin-top: 6px;
      }
      .empty {
        color: #b91c1c;
        font-weight: 500;
      }
      button {
        margin-top: 12px;
        width: 100%;
        padding: 8px;
        border: 0;
        border-radius: 6px;
        background: #9371f0;
        color: #fff;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled {
        background: #ccc;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <h1>Easy Booking</h1>
    <div id="email" class="email">—</div>
    <div id="meta" class="meta"></div>
    <button id="fill" disabled>Fill booking form now</button>
    <script src="popup.js"></script>
  </body>
</html>
